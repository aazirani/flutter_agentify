# This package has its own options so the app's plugin settings in the root
# analysis_options.yaml do not apply to it.
analyzer:
  exclude:
    - build/**
linter:
  rules:
    prefer_single_quotes: true
    prefer_const_declarations: true
    avoid_print: true
    always_declare_return_types: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
