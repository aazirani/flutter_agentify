<!DOCTYPE html>
<html>
<head>
    <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order for
      it to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      This is a placeholder for base href that will be replaced by the value of
      the `--base-href` argument provided to `flutter build`.
    -->
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="A Flutter app template built to be developed with AI coding agents, with an in-app assistant that shares the app's actions.">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta content="Flutter Agentify" name="apple-mobile-web-app-title">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <title>Flutter Agentify</title>
    <link rel="manifest" href="manifest.json">
    <!-- @on-device:begin -->
    <!-- The in-app model's web engine (experimental; off unless the setup turns it on). -->
    <script src="cache_api.js"></script>
    <script src="opfs_helper.js"></script>
    <script type="module">
    window.litertLmReady = (async () => {
      const m = await import('https://cdn.jsdelivr.net/npm/@litert-lm/core@0.18.0/+esm');
      window.Engine = m.Engine;
      window.EmbeddingEngine = m.EmbeddingEngine;
      return m.Engine;
    })();
    </script>
    <!-- @on-device:end -->
</head>
<body>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
