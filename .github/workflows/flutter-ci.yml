name: Flutter CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # @template:begin
    strategy:
      fail-fast: false
      matrix:
        starter: [template, example, empty]
    # @template:end

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # @template:begin
      - name: Create a project from the starter
        if: matrix.starter != 'template'
        run: dart tool/setup.dart --name ci_app --org com.example --starter ${{ matrix.starter }}

      # @template:end
      - name: Install dependencies
        run: flutter pub get

      - name: Run the gate
        run: tool/check.sh

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: apk, os: ubuntu-latest, args: --debug }
          - { target: web, os: ubuntu-latest }
          - { target: linux, os: ubuntu-latest }
          - { target: windows, os: windows-latest }
          - { target: macos, os: macos-latest, args: --debug }
          - { target: ios, os: macos-latest, args: --debug --no-codesign }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # @template:begin
      - name: Create a project from the template
        run: dart tool/setup.dart --name ci_app --org com.example --starter empty

      # @template:end
      - name: Install Linux build tools
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Build
        run: flutter build ${{ matrix.target }} ${{ matrix.args }}
